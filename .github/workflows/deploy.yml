name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Astro exposes only PUBLIC_* variables to the browser. They are fed
          # from the existing repository secrets, so no secret has to change.
          PUBLIC_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          # PostHog analytics. The project key is public and write-only; it is
          # kept as a secret only so it can change without touching the code.
          PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          # Optional: the Cloudflare Worker /ph proxy to get past blockers.
          PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
