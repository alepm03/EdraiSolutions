name = "edrai-gemini-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

# Deploy with:
#   npx wrangler deploy
#
# Then store the API key as a secret (never committed to git):
#   npx wrangler secret put GEMINI_API_KEY
#
# Your worker will be live at:
#   https://edrai-gemini-proxy.<YOUR_SUBDOMAIN>.workers.dev
#
# Copy that URL into Edrai Solutions-web/.env.local:
#   VITE_WORKER_URL=https://edrai-gemini-proxy.<YOUR_SUBDOMAIN>.workers.dev
