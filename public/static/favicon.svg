<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Edrai Solutions">
  <style>
    /* La mitad del corte se aclara en barras de pestañas oscuras, donde el navy
       queda casi invisible. La geometría es la del símbolo exacto, sin tocar. */
