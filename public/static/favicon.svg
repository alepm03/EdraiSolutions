    @media (prefers-color-scheme: dark) { .cut-b { fill: #FFFFFF; } }
  </style>
  <clipPath id="c"><rect x="4" y="4" width="56" height="56" rx="16"/></clipPath>
  <g clip-path="url(#c)">
    <path d="M-4 50 L68 18 L68 68 L-4 68 Z" class="cut-b"/>
    <path d="M2 38 L74 6 L74 -8 L2 -8 Z" fill="#22D3EE"/>
  </g>
</svg>
